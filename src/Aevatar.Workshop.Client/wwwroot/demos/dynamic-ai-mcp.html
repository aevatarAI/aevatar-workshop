<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic AI MCP Integration Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #6e6e73;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1d1d1f;
        }
        .button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .button:hover {
            background-color: #0051d5;
        }
        .button:disabled {
            background-color: #c4c4c6;
            cursor: not-allowed;
        }
        .button.secondary {
            background-color: #f2f2f7;
            color: #007aff;
        }
        .button.secondary:hover {
            background-color: #e2e2e7;
        }
        .button.danger {
            background-color: #ff3b30;
        }
        .button.danger:hover {
            background-color: #d70015;
        }
        .server-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .server-card {
            background: #f9f9fb;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .server-card:hover {
            border-color: #007aff;
            background: #f5f7ff;
        }
        .server-card.selected {
            border-color: #007aff;
            background: #e8f0ff;
        }
        .server-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .server-description {
            font-size: 14px;
            color: #6e6e73;
        }
        .tools-container {
            display: grid;
            gap: 16px;
        }
        .server-tools {
            background: #f9f9fb;
            border-radius: 8px;
            padding: 16px;
        }
        .server-tools-title {
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tool-badge {
            background: #34c759;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .tool-item {
            background: white;
            border: 1px solid #e5e5e7;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .tool-name {
            font-weight: 500;
            color: #007aff;
            margin-bottom: 4px;
        }
        .tool-description {
            font-size: 14px;
            color: #6e6e73;
        }
        .chat-container {
            border: 1px solid #e5e5e7;
            border-radius: 8px;
            height: 400px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f9f9fb;
        }
        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
        }
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }
        .message.user .message-avatar {
            background: #007aff;
            color: white;
        }
        .message.assistant .message-avatar {
            background: #34c759;
            color: white;
        }
        .message.system .message-avatar {
            background: #ff9500;
            color: white;
        }
        .message-content {
            flex: 1;
        }
        .message-role {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #6e6e73;
        }
        .message-text {
            background: white;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .message.assistant .message-text {
            background: #f0f8ff;
        }
        .tool-call {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 14px;
        }
        .tool-call-header {
            font-weight: 600;
            color: #856404;
            margin-bottom: 4px;
        }
        .tool-result {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 14px;
            font-family: 'Consolas', 'Monaco', monospace;
            white-space: pre-wrap;
            overflow-x: auto;
        }
        .chat-input-container {
            border-top: 1px solid #e5e5e7;
            padding: 16px;
            background: white;
            display: flex;
            gap: 12px;
        }
        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e5e5e7;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            min-height: 24px;
            max-height: 120px;
        }
        .chat-input:focus {
            outline: none;
            border-color: #007aff;
        }
        .status-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-message.success {
            background: #d1f4d3;
            color: #00692b;
        }
        .status-message.error {
            background: #ffd6d6;
            color: #c41e3a;
        }
        .status-message.info {
            background: #d6e4ff;
            color: #0051d5;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dynamic AI MCP Integration</h1>
        <p class="subtitle">AI agent that can dynamically discover and use MCP tools</p>

        <!-- Initialize Section -->
        <div class="card">
            <h2 class="section-title">1. Initialize AI Agent</h2>
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Select LLM System:</label>
                <select id="systemLLM" style="padding: 8px 12px; border: 1px solid #e5e5e7; border-radius: 8px; font-size: 16px; width: 200px;">
                    <option value="DeepSeek">DeepSeek</option>
                </select>
            </div>
            <button class="button" id="initBtn" onclick="initializeAgent()">Initialize Agent</button>
            <div id="initStatus"></div>
        </div>

        <!-- Configure MCP Servers Section -->
        <div class="card hidden" id="configSection">
            <h2 class="section-title">2. Configure MCP Servers</h2>
            <p style="color: #6e6e73; margin-bottom: 16px;">Select MCP servers to connect:</p>
            
            <div class="server-grid" id="serverGrid">
                <!-- Default servers will be populated here -->
            </div>
            
            <button class="button" id="configBtn" onclick="configureServers()">Configure Selected Servers</button>
            <div id="configStatus"></div>
        </div>

        <!-- Available Tools Section -->
        <div class="card hidden" id="toolsSection">
            <h2 class="section-title">3. Available Tools</h2>
            <div class="tools-container" id="toolsContainer">
                <!-- Tools will be displayed here -->
            </div>
        </div>

        <!-- Chat Section -->
        <div class="card hidden" id="chatSection">
            <h2 class="section-title">4. Chat with AI</h2>
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-container">
                    <textarea 
                        class="chat-input" 
                        id="chatInput" 
                        placeholder="Ask the AI to use any available tool..."
                        onkeydown="handleChatKeydown(event)"
                    ></textarea>
                    <button class="button" onclick="sendMessage()">Send</button>
                    <button class="button secondary" onclick="clearHistory()">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAgentId = null;
        const selectedServers = new Set();
        
        // Default MCP servers
        const defaultServers = [
            {
                name: 'filesystem',
                command: 'npx',
                args: ['-y', '@modelcontextprotocol/server-filesystem', '/tmp', '/Users', '/System/Volumes/Data/Users'],
                description: 'Access and manage files in allowed directories'
            },
            {
                name: 'memory',
                command: 'npx',
                args: ['-y', '@modelcontextprotocol/server-memory'],
                description: 'Store and retrieve data in temporary memory'
            },
            {
                name: 'sequential-thinking',
                command: 'npx',
                args: ['-y', '@modelcontextprotocol/server-sequential-thinking'],
                description: 'Break down complex problems step by step'
            },
            {
                name: 'everything',
                command: 'npx',
                args: ['-y', '@modelcontextprotocol/server-everything'],
                description: 'Test server with various demo tools'
            }
        ];

        // Initialize the page
        function initializePage() {
            populateServerGrid();
        }

        function populateServerGrid() {
            const grid = document.getElementById('serverGrid');
            grid.innerHTML = '';
            
            defaultServers.forEach((server, index) => {
                const card = document.createElement('div');
                card.className = 'server-card';
                card.innerHTML = `
                    <div class="server-name">${server.name}</div>
                    <div class="server-description">${server.description}</div>
                `;
                card.onclick = () => toggleServer(server, card);
                grid.appendChild(card);
            });
        }

        function toggleServer(server, element) {
            if (selectedServers.has(server.name)) {
                selectedServers.delete(server.name);
                element.classList.remove('selected');
            } else {
                selectedServers.add(server.name);
                element.classList.add('selected');
            }
        }

        async function initializeAgent() {
            const btn = document.getElementById('initBtn');
            const status = document.getElementById('initStatus');
            const systemLLM = document.getElementById('systemLLM').value;
            
            btn.disabled = true;
            status.innerHTML = '<div class="status-message info"><span class="loading"></span> Initializing AI agent...</div>';
            
            try {
                const response = await fetch('/api/DynamicAIMCP/initialize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemLLM: systemLLM
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentAgentId = data.agentId;
                    status.innerHTML = `<div class="status-message success">✓ AI agent initialized (ID: ${data.agentId})</div>`;
                    
                    // Show next section
                    document.getElementById('configSection').classList.remove('hidden');
                } else {
                    status.innerHTML = `<div class="status-message error">✗ Failed: ${data.error}</div>`;
                }
            } catch (error) {
                status.innerHTML = `<div class="status-message error">✗ Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        async function configureServers() {
            if (selectedServers.size === 0) {
                document.getElementById('configStatus').innerHTML = 
                    '<div class="status-message error">Please select at least one MCP server</div>';
                return;
            }
            
            const btn = document.getElementById('configBtn');
            const status = document.getElementById('configStatus');
            
            btn.disabled = true;
            status.innerHTML = '<div class="status-message info"><span class="loading"></span> Configuring MCP servers...</div>';
            
            // Get selected server configs
            const servers = defaultServers
                .filter(s => selectedServers.has(s.name))
                .map(s => ({
                    serverName: s.name,
                    command: s.command,
                    args: s.args,
                    description: s.description
                }));
            
            try {
                const response = await fetch('/api/DynamicAIMCP/configure-servers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agentId: currentAgentId,
                        servers: servers
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    status.innerHTML = `<div class="status-message success">✓ ${data.message}</div>`;
                    
                    // Display available tools
                    displayAvailableTools(data.availableTools);
                    
                    // Show tools and chat sections
                    document.getElementById('toolsSection').classList.remove('hidden');
                    document.getElementById('chatSection').classList.remove('hidden');
                } else {
                    status.innerHTML = `<div class="status-message error">✗ Failed: ${data.error}</div>`;
                }
            } catch (error) {
                status.innerHTML = `<div class="status-message error">✗ Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        function displayAvailableTools(toolsByServer) {
            const container = document.getElementById('toolsContainer');
            container.innerHTML = '';
            
            for (const [serverName, tools] of Object.entries(toolsByServer)) {
                const serverDiv = document.createElement('div');
                serverDiv.className = 'server-tools';
                
                let toolsHtml = `
                    <div class="server-tools-title">
                        ${serverName}
                        <span class="tool-badge">${tools.length} tools</span>
                    </div>
                `;
                
                tools.forEach(tool => {
                    toolsHtml += `
                        <div class="tool-item">
                            <div class="tool-name">${tool.name}</div>
                            <div class="tool-description">${tool.description}</div>
                        </div>
                    `;
                });
                
                serverDiv.innerHTML = toolsHtml;
                container.appendChild(serverDiv);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage('user', message);
            input.value = '';
            
            // Send to AI
            try {
                const response = await fetch('/api/DynamicAIMCP/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agentId: currentAgentId,
                        message: message
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Parse and display AI response with tool calls
                    displayAIResponse(data.response);
                } else {
                    addMessage('system', `Error: ${data.error}`);
                }
            } catch (error) {
                addMessage('system', `Error: ${error.message}`);
            }
        }

        function displayAIResponse(response) {
            // Check if response contains tool call information
            if (response.includes('Tool:') || response.includes('Result:')) {
                // Parse tool calls and results
                const lines = response.split('\n');
                let currentMessage = '';
                let inToolCall = false;
                let inResult = false;
                
                lines.forEach(line => {
                    if (line.startsWith('Tool:')) {
                        if (currentMessage) {
                            addMessage('assistant', currentMessage.trim());
                            currentMessage = '';
                        }
                        addToolCall(line);
                        inToolCall = true;
                        inResult = false;
                    } else if (line.startsWith('Result:')) {
                        addToolResult(line.substring(7).trim());
                        inToolCall = false;
                        inResult = true;
                    } else {
                        if (!inToolCall && !inResult) {
                            currentMessage += line + '\n';
                        }
                    }
                });
                
                if (currentMessage) {
                    addMessage('assistant', currentMessage.trim());
                }
            } else {
                addMessage('assistant', response);
            }
        }

        function addMessage(role, text) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatarText = role === 'user' ? 'U' : role === 'assistant' ? 'AI' : 'S';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatarText}</div>
                <div class="message-content">
                    <div class="message-role">${role.charAt(0).toUpperCase() + role.slice(1)}</div>
                    <div class="message-text">${escapeHtml(text)}</div>
                </div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addToolCall(toolInfo) {
            const messagesDiv = document.getElementById('chatMessages');
            const lastMessage = messagesDiv.lastElementChild;
            
            if (lastMessage && lastMessage.classList.contains('assistant')) {
                const content = lastMessage.querySelector('.message-content');
                const toolDiv = document.createElement('div');
                toolDiv.className = 'tool-call';
                toolDiv.innerHTML = `
                    <div class="tool-call-header">🔧 ${escapeHtml(toolInfo)}</div>
                `;
                content.appendChild(toolDiv);
            }
        }

        function addToolResult(result) {
            const messagesDiv = document.getElementById('chatMessages');
            const lastMessage = messagesDiv.lastElementChild;
            
            if (lastMessage && lastMessage.classList.contains('assistant')) {
                const content = lastMessage.querySelector('.message-content');
                const resultDiv = document.createElement('div');
                resultDiv.className = 'tool-result';
                resultDiv.textContent = result;
                content.appendChild(resultDiv);
            }
        }

        async function clearHistory() {
            if (!confirm('Clear conversation history?')) return;
            
            try {
                await fetch('/api/DynamicAIMCP/clear-history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agentId: currentAgentId })
                });
                
                document.getElementById('chatMessages').innerHTML = '';
                addMessage('system', 'Conversation history cleared');
            } catch (error) {
                addMessage('system', `Error clearing history: ${error.message}`);
            }
        }

        function handleChatKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
